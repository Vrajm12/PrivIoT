{% extends "layout.html" %}

{% block title %}Enroll Operator Account — PrivIoT Shield{% endblock %}

{% block unauth_content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="soc-card p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus text-primary fa-3x mb-2"></i>
                    <h3 class="fw-bold text-white mb-1">Enroll Operator Account</h3>
                    <p class="text-secondary" style="font-size: 13px;">Security Operations Center Access Registration</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Operator Username</label>
                        <input type="text" class="form-control bg-dark border-secondary text-white font-mono" id="username" name="username" placeholder="e.g. jdoe_secops" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Corporate Email</label>
                        <input type="email" class="form-control bg-dark border-secondary text-white font-mono" id="email" name="email" placeholder="e.g. jdoe@enterprise.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Password</label>
                        <input type="password" class="form-control bg-dark border-secondary text-white font-mono" id="password" name="password" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Confirm Password</label>
                        <input type="password" class="form-control bg-dark border-secondary text-white font-mono" id="confirm_password" name="confirm_password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="soc-btn soc-btn-primary py-2 fs-6">
                            <i class="fas fa-user-check me-2"></i> Register Account
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary">
                    <small class="text-muted">Already registered? <a href="{{ url_for('login') }}" class="text-info">Operator Login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
