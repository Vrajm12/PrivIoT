{% extends "layout.html" %}

{% block title %}Operator Login — PrivIoT Shield{% endblock %}

{% block unauth_content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="soc-card p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-shield-alt text-primary fa-3x mb-2"></i>
                    <h3 class="fw-bold text-white mb-1">Operator Authentication</h3>
                    <p class="text-secondary" style="font-size: 13px;">Security Operations Console Access</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Username</label>
                        <input type="text" class="form-control bg-dark border-secondary text-white font-mono" id="username" name="username" value="admin" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase;">Password</label>
                        <input type="password" class="form-control bg-dark border-secondary text-white font-mono" id="password" name="password" value="PrivIoTAdmin123!" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="soc-btn soc-btn-primary py-2 fs-6">
                            <i class="fas fa-sign-in-alt me-2"></i> Sign In to Console
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary">
                    <small class="text-muted">Default Pilot Operator: <code class="text-info">admin</code> / <code class="text-info">PrivIoTAdmin123!</code></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
